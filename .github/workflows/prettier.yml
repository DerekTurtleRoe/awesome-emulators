name: autofix.ci
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: npx --yes prettier@3.5.3 --write README.md

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
